idempotency:
  supported: false
  header: null
  note: 'The WordPress REST API publishes no idempotency contract: there is no Idempotency-Key header or parameter
    on any operation. PUT/PATCH are naturally idempotent by HTTP semantics; POST creates are not. No Idempotency
    pointer is emitted for this provider.'
pagination:
  style: page-number
  params:
  - name: page
    default: 1
    description: Current page of the collection.
  - name: per_page
    default: 10
    max: 100
    description: Maximum number of items returned in the result set.
  - name: offset
    description: Offset the result set by a specific number of items.
  response_headers:
  - header: X-WP-Total
    description: Total items in the collection.
    observed_example: 188 for /wp/v2/posts
  - header: X-WP-TotalPages
    description: Total pages at the requested per_page.
    observed_example: 94 at per_page=2
  - header: Link
    description: RFC 8288 rel="next" / rel="prev" page links.
  verified: '2026-07-31'
