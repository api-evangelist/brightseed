  detail: WordPress application passwords sent as HTTP Basic credentials over TLS.
  anonymous_read: true
  anonymous_verified:
  - posts
  - pages
  - media
  - categories
  - tags
  - users
  - comments
  - search
  - taxonomies
  - types
