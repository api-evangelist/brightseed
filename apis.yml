aid: brightseed
name: Brightseed
description: Brightseed is a bioactives and AI company founded in 2017 (San Francisco, CA, with operations in Durham,
  NC) that uses its Forager AI platform to map the compounds in plants to human biological pathways and health benefits.
  Forager draws on a proprietary dataset the company describes as the world's largest — 21 million bioactive compounds
  and hundreds of biological receptors spanning 23 health areas — combining high-resolution omics, high-throughput
  robotics and machine learning to predict which natural compounds confer a benefit and where to source them at
  commercial scale. Hummingbird, launched in 2026, layers an agentic AI system on top of Forager to carry partners
  from discovery through development. Brightseed sells discovery services (Bioactive Profiler, Bioactive Ingredient
  Finder) and market-ready ingredients (Bio Gut Fiber, Bio Meta Control, Bio Gut Core) to food, supplement and health-science
  companies. Brightseed publishes no product or developer API for Forager or Hummingbird — those are sold as enterprise
  engagements through a contact form. The single machine-readable surface the company operates is the WordPress
  REST API (wp/v2) behind its corporate site at www.brightseedbio.com, which exposes anonymous read access to posts,
  pages, categories, tags, users, media, comments, search, taxonomies, types and statuses, plus authenticated write
  operations via WordPress application passwords. This profile was enriched by the API Evangelist pipeline from
  that live surface.
